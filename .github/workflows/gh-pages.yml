name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Imposta i permessi necessari per GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permette un solo deployment simultaneo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Questo passaggio indica a GitHub Pages quale cartella pubblicare (in questo caso 'docs')
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}